name: HRIH Swarm Scheduled Audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: hrih-scheduled-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect repository state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .audit
          gh issue list --repo "$REPO" --state open --limit 100 --json number,title,url,labels > .audit/issues.json
          gh run list --repo "$REPO" --limit 20 --json name,conclusion,status,url,createdAt > .audit/runs.json

      - name: Verify OpenAI API secret presence
        id: secret_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            STATUS="CONFIGURED"
          else
            STATUS="MISSING"
          fi
          printf '%s\n' "$STATUS" > .audit/openai-secret-status.txt
          {
            echo "## OpenAI API secret check"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- OPENAI_API_KEY: $STATUS"
            echo "- Checked at: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Generate audit findings
        id: findings
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(".audit/issues.json",encoding="utf-8") as f:
              issues=json.load(f)
          with open(".audit/runs.json",encoding="utf-8") as f:
              runs=json.load(f)
          counts={"P0":0,"P1":0,"P2":0,"P3":0}
          for issue in issues:
              labels={label["name"].upper() for label in issue.get("labels",[])}
              for priority in counts:
                  if priority in labels:
                      counts[priority]+=1
          failures=[run for run in runs if run.get("conclusion")=="failure"]
          lines=["# HRIH Swarm Scheduled Audit","","Repository: "+os.environ["GITHUB_REPOSITORY"],"","## Open priority issues",""]
          for priority,count in counts.items():
              lines.append(f"- {priority}: {count}")
          lines.extend(["","## Open issues",""])
          for issue in issues[:30]:
              lines.append(f"- #{issue['number']} {issue['title']} - {issue['url']}")
          lines.extend(["","## Recent failed CI runs",""])
          for run in failures[:10]:
              lines.append(f"- {run['name']}: {run['url']}")
          secret_status="UNKNOWN"
          try:
              with open(".audit/openai-secret-status.txt",encoding="utf-8") as f:
                  secret_status=f.read().strip()
          except OSError:
              pass
          lines.extend(["","## GitHub Actions secret verification", "", f"- OPENAI_API_KEY: {secret_status}", "", "This checks presence only; the secret value is never printed.", "", "## Required engineering checks","","- Authentication and authorization integrity","- Supabase RLS and tenant isolation","- SMRT16 edge security and rate limiting","- WAF and threat detection","- POPIA data protection controls","- Build, tests and deployment stability","- Environment variable and secret hygiene","","This report identifies items requiring engineering review. It does not certify that these controls passed."])
          with open(".audit/report.md","w",encoding="utf-8") as f:
              f.write("\n".join(lines))
          needed=bool(counts["P0"] or counts["P1"] or failures)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"needed={str(needed).lower()}\n")
          PY

      - name: Create audit issue when needed
        if: steps.findings.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --state open --label swarm-scheduled-audit --limit 1 --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open scheduled audit already exists."
            exit 0
          fi
          gh label create swarm-scheduled-audit --repo "$REPO" --color "0E7490" --description "Consolidated HRIH swarm audit" 2>/dev/null || true
          gh label create p0 --repo "$REPO" --color "B60205" --description "Critical priority" 2>/dev/null || true
          gh issue create --repo "$REPO" --title "[Swarm Audit] P0-P3 Engineering Review" --label "swarm-scheduled-audit" --body-file .audit/report.md

      - name: Cleanup
        if: always()
        run: rm -rf .audit
